name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Deliberately NOT `-c requirements.txt`: this matrix installs the
      # NEWEST versions that `setup.py`'s compatible-version floors admit, on
      # each supported Python (3.11+). It tests forward compatibility, not
      # the floors themselves: no job installs the minimum versions. The
      # exact pins were resolved on 3.12, need 3.12+ (no 3.11 wheels for
      # numpy 2.5.1 / scipy 1.18.0), and are exercised by the `pins` job
      # below (this suite) and the `smoke` job (the live-fire driver).
      - run: pip install -e ".[dev]"
      - run: pytest tests/ --cov=riskcanvas --cov-report=xml -v
      - uses: codecov/codecov-action@v4
        with:
          file: coverage.xml

  pins:
    # The same suite on the exact versions in requirements.txt, the set the
    # Dockerfile ships, so the pins are tested on every push rather than
    # whenever someone remembers to build a fresh venv.
    name: Backend tests (Python 3.12, exact pins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" -c requirements.txt
      - run: pytest tests/

  frontend:
    name: Frontend build & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  smoke:
    # The live-fire gate: drives the REAL FastAPI engine and a
    # real headless browser and asserts the six documented crisis drawdowns
    # reproduce over HTTP and in the rendered dashboard, with zero console
    # errors. `e2e/smoke.mjs` self-starts the API (:8004) and the dashboard
    # (:3004) and tears both down. Runs on every push so this is a real gate,
    # not something a human has to remember to run locally.
    name: Live-fire smoke driver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" -c requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: make smoke

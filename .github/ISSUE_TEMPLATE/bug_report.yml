name: 🐛 Bug Report
description: Report a problem with RiskCanvas
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill out the
        sections below so we can reproduce and fix the issue quickly.

        ⚠️ **Do not report security vulnerabilities here.** See our
        [Security Policy](https://github.com/ROROK20/RiskCanvas/blob/main/SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: When I call simulate_t_distribution(...), the VaR is...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide a minimal code snippet or steps that trigger the bug.
      render: python
      placeholder: |
        from riskcanvas.metrics.risk import RiskMetrics
        ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: Affected component
      description: e.g. metrics.risk, simulation.monte_carlo, scenarios.stress_test, api, frontend
      placeholder: simulation.monte_carlo
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, and RiskCanvas version (or commit SHA).
      placeholder: |
        - Python: 3.11.6
        - OS: macOS 14.5
        - RiskCanvas: 0.1.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback
      description: Paste any relevant error output. This is auto-formatted as code.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability (those go to SECURITY.md).
          required: true
